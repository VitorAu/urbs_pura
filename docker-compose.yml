services:
  s3_db:
    image: chrislusf/seaweedfs
    container_name: urbs_pura_s3_database
    entrypoint: /bin/sh -c
    command: |
      "echo '{
        \"identities\": [
          {
            \"name\": \"anonymous\",
            \"actions\": [
              \"Read\"
            ]
          },
          {
            \"name\": \"some_admin_user\",
            \"credentials\": [
              {
                \"accessKey\": \"some_access_key1\",
                \"secretKey\": \"some_secret_key1\"
              }
            ],
            \"actions\": [
              \"Admin\",
              \"Read\",
              \"List\",
              \"Tagging\",
              \"Write\"
            ]
          }
        ]
      }' > /etc/seaweedfs/config.json && \
      weed server -s3 -s3.config /etc/seaweedfs/config.json"
    restart: unless-stopped
  db:
    # image: postgis/postgis:18-3.6-alpine
    image: imresamu/postgis:18-3.6-alpine3.23
    container_name: urbs_pura_database
    restart: always
    shm_size: 1GB
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ./api/
      dockerfile: Dockerfile
    container_name: urbs_pura_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DART_ENV: ${DART_ENV}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      SERVER_PORT: ${SERVER_PORT}
      SERVER_JWT_SECRET: ${SERVER_JWT_SECRET}
      SERVER_JWT_ACCESS_TOKEN_EXPIRATION: ${SERVER_JWT_ACCESS_TOKEN_EXPIRATION}
      SERVER_JWT_REFRESH_TOKEN_EXPIRATION: ${SERVER_JWT_REFRESH_TOKEN_EXPIRATION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}

      





